name: Ceaser Diagnose

# Reusable workflow. Call it from a job in another repository:
#
#   jobs:
#     ceaser:
#       if: github.event.workflow_run.conclusion == 'failure'
#       permissions:
#         actions: read
#         contents: read
#         pull-requests: write
#       uses: Malenia-org/ceaser/.github/workflows/ci-diagnose.yml@main
#       with:
#         run_id: ${{ github.event.workflow_run.id }}
#         head_sha: ${{ github.event.workflow_run.head_sha }}
#
# The target repository supplies the source code, the failing command (through
# .ceaser.yml or the `command` input), and its runtime. Ceaser supplies the
# diagnosis engine.

on:
  workflow_call:
    inputs:
      command:
        description: Failing command; overrides command in .ceaser.yml
        type: string
        required: false
        default: ''
      head_sha:
        description: Commit to diagnose; defaults to the checked-out commit
        type: string
        required: false
        default: ''
      base_sha:
        description: Exact base commit; wins over base_ref
        type: string
        required: false
        default: ''
      base_ref:
        description: Base revision or ref; defaults to merge-base with the default branch
        type: string
        required: false
        default: ''
      run_id:
        description: Failed workflow run id whose logs should be collected
        type: string
        required: false
        default: ''
      attempts:
        description: Reproduction attempts; overrides attempts in .ceaser.yml
        type: string
        required: false
        default: ''
      docker_image:
        description: Docker image for the docker executor; overrides image in .ceaser.yml
        type: string
        required: false
        default: ''
      go_cold_path:
        description: Explicitly run focused retained-binary Go verification in Docker
        type: boolean
        required: false
        default: false
      go_cold_path_attempts:
        description: Focused Go verification attempts per revision
        type: string
        required: false
        default: '3'
      agent:
        description: Ask the configured model gateway to analyze the collected evidence
        type: boolean
        required: false
        default: false
      agent_code_retrieval:
        description: Let the optional model request bounded Go snippets at the failing commit
        type: boolean
        required: false
        default: false
      ceaser_version:
        description: Use main for a source build, or choose a release tag or latest
        type: string
        required: false
        default: main
      ceaser_repository:
        description: Repository that publishes Ceaser releases
        type: string
        required: false
        default: Malenia-org/ceaser
      comment:
        description: Post the diagnosis as a pull request comment when the run belongs to a PR
        type: boolean
        required: false
        default: true
    secrets:
      CEASER_GATEWAY_ENDPOINT:
        required: false
      CEASER_GATEWAY_MODEL:
        required: false
    outputs:
      classification:
        description: Deterministic classification of the failure
        value: ${{ jobs.diagnose.outputs.classification }}
      refused:
        description: Whether Ceaser refused to classify the failure
        value: ${{ jobs.diagnose.outputs.refused }}

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  diagnose:
    name: Diagnose failure
    runs-on: ubuntu-24.04
    outputs:
      classification: ${{ steps.diagnose.outputs.classification }}
      refused: ${{ steps.diagnose.outputs.refused }}
      pr: ${{ steps.revisions.outputs.pr }}
      head: ${{ steps.revisions.outputs.head }}
    steps:
      - name: Checkout failing commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve revisions
        id: revisions
        env:
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          EVENT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EVENT_PR_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
        run: |
          set -euo pipefail
          head="$INPUT_HEAD_SHA"
          if [ -z "$head" ]; then
            head="$(git rev-parse HEAD)"
          fi
          git checkout --force --detach "$head"
          head="$(git rev-parse HEAD)"

          base="$INPUT_BASE_SHA"
          if [ -z "$base" ]; then
            if [ -n "$EVENT_PR_NUMBER" ]; then
              base="$EVENT_PR_BASE_SHA"
              if [ -z "$base" ]; then
                echo "pull request base SHA is missing" >&2
                exit 1
              fi
            fi
          fi
          if [ -z "$base" ]; then
            ref="$INPUT_BASE_REF"
            if [ -z "$ref" ]; then
              ref="origin/${{ github.event.repository.default_branch || 'main' }}"
            fi
            fetch_ref="${ref#origin/}"
            git fetch --no-tags origin "$fetch_ref" || true
            base="$(git merge-base HEAD "$ref" 2>/dev/null || true)"
          fi

          pr="$EVENT_PR_NUMBER"
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            pr="${{ github.event.pull_request.number }}"
          fi
          if [ "$pr" = "null" ]; then
            pr=""
          fi

          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Collect failed job logs
        if: inputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          raw_log="$RUNNER_TEMP/ceaser-failed.raw.log"
          gh run view "$INPUT_RUN_ID" --repo "$INPUT_REPOSITORY" \
            --log-failed > "$raw_log" 2>&1 || true
          # Keep original CI evidence bounded and remove common credential-shaped
          # values before it reaches an artifact or the diagnosis process.
          sed -E \
            -e 's/(authorization:[[:space:]]*bearer[[:space:]]+)[^[:space:]]+/\1[REDACTED]/Ig' \
            -e 's/(authorization:[[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' \
            -e 's/((token|password|secret|api[_-]?key)[=:][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' \
            -e 's/(gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+|AKIA[0-9A-Z]{16})/[REDACTED]/g' \
            "$raw_log" | head -c 262144 > "$RUNNER_TEMP/ceaser-failed.log" || true
          gh run view "$INPUT_RUN_ID" --repo "$INPUT_REPOSITORY" \
            --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | "\(.name) (\(.databaseId))"' \
            > "$RUNNER_TEMP/ceaser-failed-jobs.txt" 2>&1 || true
          mkdir -p "$RUNNER_TEMP/ceaser-artifacts"
          gh run download "$INPUT_RUN_ID" --repo "$INPUT_REPOSITORY" \
            --dir "$RUNNER_TEMP/ceaser-artifacts" || true

      - name: Set up Go for Ceaser source install
        if: inputs.ceaser_version == 'main'
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Install ceaser
        env:
          INPUT_VERSION: ${{ inputs.ceaser_version }}
          INPUT_REPOSITORY: ${{ inputs.ceaser_repository }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          repository="$INPUT_REPOSITORY"
          if [[ ! "$version" =~ ^(main|latest|v[0-9A-Za-z._-]+)$ ]]; then
            echo "invalid ceaser_version" >&2
            exit 2
          fi
          if [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "invalid ceaser_repository" >&2
            exit 2
          fi
          if [ "$version" = "main" ]; then
            GOBIN="$RUNNER_TEMP" go install "github.com/$repository/cmd/ceaser@main"
            echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/ceaser" version
            exit 0
          fi
          if [ "$version" = "latest" ]; then
            base_url="https://github.com/$repository/releases/latest/download"
          else
            base_url="https://github.com/$repository/releases/download/$version"
          fi
          for asset in ceaser_linux_amd64 malenia_linux_amd64 causent_linux_amd64; do
            if curl -fsSL "$base_url/$asset" -o "$RUNNER_TEMP/ceaser"; then break; fi
          done
          curl -fsSL "$base_url/SHA256SUMS" -o "$RUNNER_TEMP/ceaser.SHA256SUMS"
          (cd "$RUNNER_TEMP" && grep "  $asset\$" ceaser.SHA256SUMS | sed "s/$asset/ceaser/" | sha256sum -c -)
          chmod +x "$RUNNER_TEMP/ceaser"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ceaser" version

      - name: Set up Go
        if: inputs.docker_image == '' && hashFiles('go.mod') != ''
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Restore Go's content-addressed module and build caches so repeated
          # investigations compile only packages invalidated by the PR.
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Diagnose
        id: diagnose
        env:
          INPUT_COMMAND: ${{ inputs.command }}
          INPUT_ATTEMPTS: ${{ inputs.attempts }}
          INPUT_DOCKER_IMAGE: ${{ inputs.docker_image }}
          INPUT_GO_COLD_PATH_ATTEMPTS: ${{ inputs.go_cold_path_attempts }}
          CEASER_SANDBOX_MEMORY_MB: ${{ inputs.go_cold_path && '3072' || '512' }}
          INPUT_BASE: ${{ steps.revisions.outputs.base }}
          CEASER_CI_PROVIDER: github-actions
          CEASER_CI_RUN_ID: ${{ inputs.run_id }}
          CEASER_CI_PR_NUMBER: ${{ steps.revisions.outputs.pr }}
          CEASER_CI_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.run_id }}
          INPUT_CI_LOG: ${{ runner.temp }}/ceaser-failed.log
          INPUT_ARTIFACT_DIR: ${{ runner.temp }}/ceaser-artifacts
        run: |
          set -euo pipefail
          args=(diagnose --repo . --json --bundle "$RUNNER_TEMP/ceaser-bundle")

          if [ -n "$INPUT_COMMAND" ]; then
            args+=(--command "$INPUT_COMMAND")
          fi
          if [ -n "$INPUT_BASE" ]; then
            args+=(--base "$INPUT_BASE")
          fi
          if [ -s "$INPUT_CI_LOG" ]; then
            args+=(--ci-log "$INPUT_CI_LOG")
          fi
          if [ -d "$INPUT_ARTIFACT_DIR" ]; then
            args+=(--artifact-dir "$INPUT_ARTIFACT_DIR" --artifact-first)
          fi
          if [ -n "$INPUT_ATTEMPTS" ]; then
            args+=(--attempts "$INPUT_ATTEMPTS")
          fi
          if [ -n "$INPUT_DOCKER_IMAGE" ]; then
            args+=(--executor docker --image "$INPUT_DOCKER_IMAGE")
          fi
          if [ "${{ inputs.go_cold_path }}" = "true" ]; then
            if [ -z "$INPUT_DOCKER_IMAGE" ]; then
              echo 'go_cold_path requires docker_image' >&2
              exit 2
            fi
            if [[ ! "$INPUT_GO_COLD_PATH_ATTEMPTS" =~ ^([1-9]|1[0-9]|20)$ ]]; then
              echo 'go_cold_path_attempts must be between 1 and 20' >&2
              exit 2
            fi
            args+=(--go-cold-path --go-cold-path-attempts "$INPUT_GO_COLD_PATH_ATTEMPTS")
          fi
          status=0
          ceaser "${args[@]}" > "$RUNNER_TEMP/ceaser-report.json" \
            2> "$RUNNER_TEMP/ceaser-stderr.log" || status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

          if ! jq -e . "$RUNNER_TEMP/ceaser-report.json" > /dev/null 2>&1; then
            {
              echo "## Ceaser diagnosis"
              echo
              echo "Ceaser did not produce a report (exit $status)."
              echo
              echo '```'
              tail -50 "$RUNNER_TEMP/ceaser-stderr.log"
              echo '```'
            } > "$RUNNER_TEMP/ceaser-summary.md"
            cat "$RUNNER_TEMP/ceaser-summary.md" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          classification="$(jq -r '.classification // "unknown"' "$RUNNER_TEMP/ceaser-report.json")"
          refused="$(jq -r '.refused // false' "$RUNNER_TEMP/ceaser-report.json")"
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          echo "refused=$refused" >> "$GITHUB_OUTPUT"

          {
            echo "## Ceaser diagnosis"
            echo
            echo "**Classification**: \`$classification\`"
            echo
            jq -r '
              (if .baseline.source == "ci_artifact" then
                "**Evidence**: \(.baseline.failures) failure observation(s) from existing CI artifacts; no local reproduction  "
              else
                "**Reproduced**: \(.baseline.failures)/\(.baseline.attempts) attempts failed  "
              end),
              "**Confidence**: \(.confidence)  ",
              (if ((.adapter_capabilities // []) | length) > 0 then
                "**Adapter support**: " + ((.adapter_capabilities // []) | map((.language // .adapter) + "=`" + .level + "`") | join(", ")) + "  "
              else empty end),
              (if .comparison then
                "**Base/head**: base \(.comparison.base.failures)/\(.comparison.base.attempts), head \(.comparison.head.failures)/\(.comparison.head.attempts) → `\(.comparison.verdict)`  "
              else empty end),
              (if .go_cold_path then
                "**Focused Go verification**: status `\(.go_cold_path.status)`, verdict `\(.go_cold_path.verdict)`, head matches \(.go_cold_path.head.matched)" + (if .go_cold_path.base then ", base matches \(.go_cold_path.base.matched)" else "" end) + "  "
              else empty end),
              (if .comparison then
                (if .comparison.verdict == "real_regression" then
                  "**PR relationship**: the head failed while the base passed; the PR is implicated by controlled comparison  "
                elif .comparison.verdict == "pre_existing_failure" then
                  "**PR relationship**: the same command failed on the base; the failure is pre-existing  "
                else
                  "**PR relationship**: base/head evidence is not sufficient to attribute the failure to this PR  "
                end)
              else empty end),
              (if .localization.first_known_bad then
                "**First known bad**: `\(.localization.first_known_bad)`  "
              else empty end),
              (if .refused then "**Refused**: \(.refusal_reason)  " else empty end),
              "",
              (if ((.findings // []) | map(select(.kind == "incident_diagnosis")) | length) > 0 then
                "**Primary diagnosis**:\n" + ((.findings // []) | map(select(.kind == "incident_diagnosis") | "- " + .statement) | join("\n"))
              else empty end),
              (if ((.failure_incidents // []) | length) > 0 then
                "**Observed incident locations**:\n" + ((.failure_incidents // []) | map(.observed_locations // [] | map("- " + (.access // "access") + " `" + (.file // "unknown") + ":" + ((.line // 0)|tostring) + "` (" + (.provenance // "unknown provenance") + ")") | join("\n")) | join("\n"))
              else empty end),
              (if ((.candidates // []) | length) > 0 then
                "**Supporting candidate locations**:\n" + ([.candidates[] | select((.score.execution_relevance // 0) > 0 or (.score.runtime_relevance // 0) > 0 or (.score.change_relevance // 0) > 0)][0:8] | map("- `" + (.location.file_path // "unknown") + ":" + ((.location.start_line // 0)|tostring) + "` — " + (.location.symbol_identity // "unresolved") + " (" + (if .location.provenance == "enclosing_symbol" then "enclosing symbol" elif .location.provenance == "inferred_caller" then "inferred structural candidate" elif .location.provenance == "direct_stack_frame" then "directly observed location" else (.location.provenance // "unattributed") end) + ")") | join("\n"))
              else empty end),
              (if ((.root_cause.statement // "") != "") then
                "**Root cause**: [" + (.root_cause.status // "unknown") + "] " + .root_cause.statement + "\n**Causality**: " + (.root_cause.causality_status // "unverified") + "; verification: " + (.root_cause.verification_status // "not_attempted")
              else empty end),
              (if ((.root_cause.next_actions // []) | length) > 0 then
                "**Next verification**:\n" + ((.root_cause.next_actions // []) | map("- " + .) | join("\n"))
              else empty end),
              (if ((.failure_episodes // []) | length) > 0 then
                "**Failure episodes**:\n" + ((.failure_episodes[0:12] // []) | map("- **" + (.test_identifier // "unknown test") + "** — " + (.failure_type // "observed failure") + ": " + (.failure_message // "no message")) | join("\n"))
              else empty end),
              (if ((.race_reports // []) | length) > 0 then
                "**Race evidence**:\n" + ((.race_reports[0:5] // []) | map("- " + (.test // "unknown test") + ": read " + ((.read_stack[0].file // "unknown") + ":" + ((.read_stack[0].line // 0)|tostring)) + "; write " + ((.write_stack[0].file // "unknown") + ":" + ((.write_stack[0].line // 0)|tostring))) | join("\n"))
              else empty end),
              (if ((.candidates // []) | length) > 0 then
                "**Inspected source candidates**:\n" + ((.candidates[0:5] // []) | map("- `" + (.location.file_path // "unknown") + ":" + ((.location.start_line // 0)|tostring) + "` — " + (.location.symbol_identity // "unresolved") + " (" + (.location.provenance // .location.location_type // "unattributed") + "; execution=" + ((.score.execution_relevance // 0)|tostring) + ")") | join("\n"))
              else empty end),
              (if ((.execution_paths // []) | length) > 0 then
                "**Static call paths (inferred, not observed runtime paths)**:\n" + ((.execution_paths[0:5] // []) | map("- [" + (.status // "inferred") + "] " + .summary) | join("\n"))
              else empty end),
              "",
              (if ((.hypotheses // []) | map(select((.statement // "") != "" and ((.supporting_evidence_ids // []) | length) > 0 and ((.contradicting_evidence_ids // []) | length) > 0 and ((.predicted_observations // []) | length) > 0)) | length) > 0 then
                "**Causal hypotheses**:\n" + ((.hypotheses // []) | map(select((.statement // "") != "" and ((.supporting_evidence_ids // []) | length) > 0 and ((.contradicting_evidence_ids // []) | length) > 0 and ((.predicted_observations // []) | length) > 0) | "- " + .statement) | join("\n"))
              else empty end),
              "",
              (if ((.uncertainty // []) | length) > 0 then
                "**Uncertainty**:\n" + ((.uncertainty // []) | map("- \(.)") | join("\n"))
              else empty end)
            ' "$RUNNER_TEMP/ceaser-report.json"
            echo
            echo "Bundle: \`$(jq -r '.bundle_path // "not written"' "$RUNNER_TEMP/ceaser-report.json")\`"
          } > "$RUNNER_TEMP/ceaser-summary.md"
          cat "$RUNNER_TEMP/ceaser-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnosis bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ceaser-diagnosis-raw-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ceaser-report.json
            ${{ runner.temp }}/ceaser-summary.md
            ${{ runner.temp }}/ceaser-stderr.log
            ${{ runner.temp }}/ceaser-failed.log
            ${{ runner.temp }}/ceaser-failed-jobs.txt
            ${{ runner.temp }}/ceaser-artifacts
            ${{ runner.temp }}/ceaser-bundle
          if-no-files-found: ignore

  analyze:
    name: Optional model analysis
    needs: diagnose
    if: needs.diagnose.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download deterministic diagnosis
        uses: actions/download-artifact@v4
        with:
          name: ceaser-diagnosis-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/ceaser-raw

      - name: Set up Go for Ceaser source install
        if: inputs.ceaser_version == 'main'
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Install ceaser
        env:
          INPUT_VERSION: ${{ inputs.ceaser_version }}
          INPUT_REPOSITORY: ${{ inputs.ceaser_repository }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          repository="$INPUT_REPOSITORY"
          if [[ ! "$version" =~ ^(main|latest|v[0-9A-Za-z._-]+)$ ]]; then
            echo "invalid ceaser_version" >&2
            exit 2
          fi
          if [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "invalid ceaser_repository" >&2
            exit 2
          fi
          if [ "$version" = "main" ]; then
            GOBIN="$RUNNER_TEMP" go install "github.com/$repository/cmd/ceaser@main"
            echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/ceaser" version
            exit 0
          fi
          if [ "$version" = "latest" ]; then
            base_url="https://github.com/$repository/releases/latest/download"
          else
            base_url="https://github.com/$repository/releases/download/$version"
          fi
          for asset in ceaser_linux_amd64 malenia_linux_amd64 causent_linux_amd64; do
            if curl -fsSL "$base_url/$asset" -o "$RUNNER_TEMP/ceaser"; then break; fi
          done
          curl -fsSL "$base_url/SHA256SUMS" -o "$RUNNER_TEMP/ceaser.SHA256SUMS"
          (cd "$RUNNER_TEMP" && grep "  $asset\$" ceaser.SHA256SUMS | sed "s/$asset/ceaser/" | sha256sum -c -)
          chmod +x "$RUNNER_TEMP/ceaser"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ceaser" version

      - name: Preserve deterministic report
        if: inputs.agent == false
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ceaser-final"
          cp "$RUNNER_TEMP/ceaser-raw/ceaser-report.json" "$RUNNER_TEMP/ceaser-final/ceaser-report.json"

      - name: Checkout source for read-only model retrieval
        if: inputs.agent && inputs.agent_code_retrieval && needs.diagnose.outputs.head != ''
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: ${{ needs.diagnose.outputs.head }}
          path: ceaser-agent-source
          persist-credentials: false

      - name: Analyze validated diagnosis
        if: inputs.agent == true
        env:
          CEASER_GATEWAY_ENDPOINT: ${{ secrets.CEASER_GATEWAY_ENDPOINT }}
          CEASER_GATEWAY_MODEL: ${{ secrets.CEASER_GATEWAY_MODEL }}
          CODE_REVISION: ${{ needs.diagnose.outputs.head }}
          CODE_RETRIEVAL: ${{ inputs.agent_code_retrieval }}
        run: |
          set -euo pipefail
          code_args=()
          if [ "$CODE_RETRIEVAL" = "true" ] && [ -d "$GITHUB_WORKSPACE/ceaser-agent-source/.git" ]; then
            code_args=(--code-repo "$GITHUB_WORKSPACE/ceaser-agent-source" --code-revision "$CODE_REVISION")
          fi
          mkdir -p "$RUNNER_TEMP/ceaser-final"
          if ! ceaser analyze \
            --report "$RUNNER_TEMP/ceaser-raw/ceaser-report.json" \
            --output "$RUNNER_TEMP/ceaser-final/ceaser-report.json" "${code_args[@]}"; then
            cp "$RUNNER_TEMP/ceaser-raw/ceaser-report.json" "$RUNNER_TEMP/ceaser-final/ceaser-report.json"
          fi

      - name: Copy evidence artifacts
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/ceaser-raw/ceaser-summary.md" "$RUNNER_TEMP/ceaser-final/ceaser-summary.md" || true
          cp "$RUNNER_TEMP/ceaser-raw/ceaser-stderr.log" "$RUNNER_TEMP/ceaser-final/ceaser-stderr.log" || true
          cp "$RUNNER_TEMP/ceaser-raw/ceaser-failed.log" "$RUNNER_TEMP/ceaser-final/ceaser-failed.log" || true
          cp "$RUNNER_TEMP/ceaser-raw/ceaser-failed-jobs.txt" "$RUNNER_TEMP/ceaser-final/ceaser-failed-jobs.txt" || true
          cp -R "$RUNNER_TEMP/ceaser-raw/ceaser-bundle" "$RUNNER_TEMP/ceaser-final/ceaser-bundle" || true

      - name: Upload final diagnosis
        uses: actions/upload-artifact@v6
        with:
          name: ceaser-diagnosis-${{ github.run_id }}
          path: ${{ runner.temp }}/ceaser-final
          if-no-files-found: error

  publish:
    name: Publish diagnosis
    needs: [diagnose, analyze]
    if: needs.analyze.result == 'success' && inputs.comment && needs.diagnose.outputs.pr != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Download diagnosis result
        uses: actions/download-artifact@v4
        with:
          name: ceaser-diagnosis-${{ github.run_id }}
          path: ${{ runner.temp }}/ceaser-result

      - name: Prepare bounded diagnosis comment
        env:
          PR_NUMBER: ${{ needs.diagnose.outputs.pr }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/ceaser-result/ceaser-report.json"
          test -s "$report"
          classification="$(jq -r '.classification // "unknown"' "$report")"
          refused="$(jq -r '.refused // false' "$report")"
          failures="$(jq -r '.baseline.failures // 0' "$report")"
          attempts="$(jq -r '.baseline.attempts // 0' "$report")"
          command="$(jq -r 'if (.command | type) == "array" then (.command | join(" ")) else (.command // "not configured") end' "$report")"
          base_passes="$(jq -r '.comparison.base.passes // 0' "$report")"
          base_attempts="$(jq -r '.comparison.base.attempts // 0' "$report")"
          locations="$(jq -r '(.failure_incidents // []) | map(.observed_locations // [] | map((.access // "access") + " " + (.file // "unknown") + ":" + ((.line // 0)|tostring) + " (" + (.provenance // "unknown provenance") + ")") | join("; ")) | join("\n")' "$report")"
          # Use the structured shortlist when available, with a fallback for older reports.
          shortlist="$(jq -r '
            if ((.candidate_report.entries // []) | length) > 0 then
              [.candidate_report.entries[0:5][] |
                "[" + (.kind // "candidate") + "] " + (.file // "unknown") +
                (if ((.line // 0) > 0) then ":" + (.line|tostring) else "" end) +
                (if ((.function // "") == "") then "" else " " + .function end) +
                " — " + (.reason // "ranked candidate") +
                (if ((.evidence_ids // []) | length) > 0 then " [Evidence: " + ((.evidence_ids[0:3]) | join(", ")) + "]" else "" end)
              ] | join("\n")
            else
              (.candidates[0:5] // []) | map((.location.file_path // "unknown") + ":" + ((.location.start_line // 0)|tostring) + (if (.location.symbol_identity // "") == "" then "" else " " + .location.symbol_identity end) + " (" + (.location.provenance // "unattributed") + ")") | join("; ")
            end
          ' "$report")"
          implementation_found="$(jq -r '
            [(.candidate_report.entries // [])[]?.file, (.candidates // [])[]?.location.file_path]
            | any(type == "string" and length > 0 and (endswith("_test.go") | not))
          ' "$report")"
          if [ "$implementation_found" != "true" ]; then
            shortlist="No implementation candidate found."
          fi
          probe_status="$(jq -r '.candidate_report.probe_status // (.mechanism_observation.status // "disabled")' "$report")"
          groups="$(jq -r '(.failure_groups // []) | if length == 0 then "none recorded" else map("\(.status): \((.failure_ids // []) | join(", "))") | join("; ") end' "$report")"
          episodes="$(jq -r '(.failure_episodes // []) | if length == 0 then "none recorded" else map((.test_identifier // "unknown test") + ": " + (.failure_message // "")) | .[0:10] | join("; ") end' "$report")"
          incidents="$(jq -r '(.failure_incidents // []) | if length == 0 then "none recorded" else map((.category // "failure") + " — tests: " + ((.affected_tests // []) | join(", ")) + "; " + (.observed_explanation // "") + "; PR: " + (.pr_relationship // "not established")) | join("\n") end' "$report")"
          hypotheses="$(jq -r '(.hypotheses // []) | map(select((.statement // "") != "" and ((.supporting_evidence_ids // []) | length) > 0 and ((.contradicting_evidence_ids // []) | length) > 0 and ((.predicted_observations // []) | length) > 0) | "[\(.status)] \(.statement)") | if length == 0 then "no causal hypothesis established" else .[0:3] | join("; ") end' "$report")"
          paths="$(jq -r '(.execution_paths // []) | if length == 0 then "none reconstructed" else map("[" + (.status // "inferred") + "] " + .summary) | .[0:3] | join("; ") end' "$report")"
          finding="$(jq -r '(.findings // []) | map(select(.kind == "incident_diagnosis") | .statement) | .[0] // "no primary incident finding"' "$report")"
          root_cause="$(jq -r '(.root_cause // {}) | ((.status // "unknown") + ": " + (.statement // "not established") + "; causality=" + (.causality_status // "unverified") + "; verification=" + (.verification_status // "not_attempted"))' "$report")"
          failure="$(jq -r '.baseline.results[0].stderr_excerpt // ""' "$report" | grep -E -- '--- FAIL:|^FAIL' | head -3 | tr '\n' ' ' || true)"
          plain() {
            printf '%s' "$1" | jq -Rs '.[0:1200] | gsub("@"; "＠") | @html | gsub("\n"; " ") | gsub("\u0060"; "&#96;") | gsub("\\["; "&#91;") | gsub("\\]"; "&#93;")'
          }
          for field in classification refused failures attempts command base_passes base_attempts locations shortlist probe_status groups episodes incidents hypotheses paths finding root_cause failure; do
            printf -v "$field" '%s' "$(plain "${!field}")"
          done
          artifact_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(cat <<EOF
          ## Ceaser diagnosis

          **Classification:** ${classification}<br>
          **Command:** ${command}

          **Reproduction:** ${failures}/${attempts} head attempts failed; ${base_passes}/${base_attempts} base attempts passed.
          **Refused:** ${refused}

          **Primary diagnosis:** ${finding}
          **Observed locations:** ${locations:-not recorded}<br>
          **Where to look:** ${shortlist:-none recorded}
          **Runtime probe:** ${probe_status}

          **Failure groups:** ${groups}

          **Failed tests/episodes:** ${episodes}

          **Failure incident:** ${incidents}

          **Root cause assessment:** ${root_cause}

          **Hypotheses:** ${hypotheses}

          **Execution paths:** ${paths}

          **Observed failure:** ${failure:-No failure line extracted}

          **Uncertainty:** Review the full evidence before treating the localization as a confirmed root cause.

          [View workflow run and diagnosis artifact](${artifact_url})
          EOF
          )
          printf '%s\n' "$body" > "$RUNNER_TEMP/ceaser-comment.md"
          jq -r '
            if .agent_status == "completed" then
              [.agent.hypotheses[0:2][]? |
                ((.statement // "")[0:600] + " [Evidence: " +
                 ((.supporting_evidence_ids // []) | join(", ") | .[0:240]) + "]") |
                gsub("@"; "＠") | @html]
              | if length > 0 then "\n**Model hypotheses**\n\n<pre>" + join("\n\n") + "</pre>" else empty end
            else empty end
          ' "$report" >> "$RUNNER_TEMP/ceaser-comment.md"

      - name: Publish bounded diagnosis comment
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.diagnose.outputs.pr }}
          COMMENT_PATH: ${{ runner.temp }}/ceaser-comment.md
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8');
            const issueNumber = Number(process.env.PR_NUMBER);
            const marker = '<!-- ceaser-diagnosis -->';
            const previousMarker = '<!-- malenia-diagnosis -->';
            const markedBody = `${marker}\n${body}`;
            if (!Number.isInteger(issueNumber) || issueNumber < 1) {
              throw new Error(`Invalid pull request number: ${process.env.PR_NUMBER}`);
            }

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              const existing = comments.find(comment =>
                comment.user?.login === 'github-actions[bot]' &&
                (comment.body?.includes(marker) || comment.body?.includes(previousMarker))
              );
              const payload = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: markedBody,
              };
              if (existing) {
                await github.rest.issues.updateComment({ ...payload, comment_id: existing.id });
              } else {
                await github.rest.issues.createComment(payload);
              }
            } catch (error) {
              core.setFailed(`Unable to publish diagnosis comment: ${error.status ?? 'unknown'} ${error.message}`);
            }
