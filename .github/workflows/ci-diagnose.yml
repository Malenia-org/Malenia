name: Ceaser Diagnose

# Reusable workflow. Call it from a job in another repository:
#
#   jobs:
#     ceaser:
#       if: github.event.workflow_run.conclusion == 'failure'
#       permissions:
#         actions: read
#         contents: read
#         pull-requests: write
#       uses: ceaser-org/ceaser/.github/workflows/ci-diagnose.yml@main
#       with:
#         run_id: ${{ github.event.workflow_run.id }}
#         head_sha: ${{ github.event.workflow_run.head_sha }}
#
# The target repository supplies the source code, the failing command (through
# .ceaser.yml or the `command` input), and its runtime. Ceaser supplies the
# diagnosis engine.

on:
  workflow_call:
    inputs:
      command:
        description: Failing command; overrides command in .ceaser.yml
        type: string
        required: false
        default: ''
      head_sha:
        description: Commit to diagnose; defaults to the checked-out commit
        type: string
        required: false
        default: ''
      base_sha:
        description: Exact base commit; wins over base_ref
        type: string
        required: false
        default: ''
      base_ref:
        description: Base revision or ref; defaults to merge-base with the default branch
        type: string
        required: false
        default: ''
      run_id:
        description: Failed workflow run id whose logs should be collected
        type: string
        required: false
        default: ''
      attempts:
        description: Reproduction attempts; overrides attempts in .ceaser.yml
        type: string
        required: false
        default: ''
      docker_image:
        description: Docker image for the docker executor; overrides image in .ceaser.yml
        type: string
        required: false
        default: ''
      go_cold_path:
        description: Explicitly run focused retained-binary Go verification in Docker
        type: boolean
        required: false
        default: false
      go_cold_path_attempts:
        description: Focused Go verification attempts per revision
        type: string
        required: false
        default: '3'
      agent:
        description: Ask the configured model gateway to analyze the collected evidence
        type: boolean
        required: false
        default: false
      agent_code_retrieval:
        description: Let the optional model request bounded Go snippets at the failing commit
        type: boolean
        required: false
        default: false
      ceaser_version:
        description: Use main for a source build, or choose a release tag or latest
        type: string
        required: false
        default: main
      ceaser_repository:
        description: Repository that publishes Ceaser releases
        type: string
        required: false
        default: ceaser-org/ceaser
      comment:
        description: Post the diagnosis as a pull request comment when the run belongs to a PR
        type: boolean
        required: false
        default: true
      comment_detail:
        description: Use short for collapsed evidence or detailed to show it by default
        type: string
        required: false
        default: short
    secrets:
      CEASER_GATEWAY_ENDPOINT:
        required: false
      CEASER_GATEWAY_MODEL:
        required: false
    outputs:
      classification:
        description: Deterministic classification of the failure
        value: ${{ jobs.diagnose.outputs.classification }}
      refused:
        description: Whether Ceaser refused to classify the failure
        value: ${{ jobs.diagnose.outputs.refused }}

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  diagnose:
    name: Diagnose failure
    runs-on: ubuntu-24.04
    outputs:
      classification: ${{ steps.diagnose.outputs.classification }}
      refused: ${{ steps.diagnose.outputs.refused }}
      pr: ${{ steps.revisions.outputs.pr }}
      head: ${{ steps.revisions.outputs.head }}
    steps:
      - name: Checkout failing commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve revisions
        id: revisions
        env:
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          EVENT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EVENT_PR_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
        run: |
          set -euo pipefail
          head="$INPUT_HEAD_SHA"
          if [ -z "$head" ]; then
            head="$(git rev-parse HEAD)"
          fi
          git checkout --force --detach "$head"
          head="$(git rev-parse HEAD)"

          base="$INPUT_BASE_SHA"
          if [ -z "$base" ]; then
            if [ -n "$EVENT_PR_NUMBER" ]; then
              base="$EVENT_PR_BASE_SHA"
              if [ -z "$base" ]; then
                echo "pull request base SHA is missing" >&2
                exit 1
              fi
            fi
          fi
          if [ -z "$base" ]; then
            ref="$INPUT_BASE_REF"
            if [ -z "$ref" ]; then
              ref="origin/${{ github.event.repository.default_branch || 'main' }}"
            fi
            fetch_ref="${ref#origin/}"
            git fetch --no-tags origin "$fetch_ref" || true
            base="$(git merge-base HEAD "$ref" 2>/dev/null || true)"
          fi

          pr="$EVENT_PR_NUMBER"
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            pr="${{ github.event.pull_request.number }}"
          fi
          if [ "$pr" = "null" ]; then
            pr=""
          fi

          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Collect failed job logs
        if: inputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          raw_log="$RUNNER_TEMP/ceaser-failed.raw.log"
          gh run view "$INPUT_RUN_ID" --repo "$INPUT_REPOSITORY" \
            --log-failed > "$raw_log" 2>&1 || true
          # Keep original CI evidence bounded and remove common credential-shaped
          # values before it reaches an artifact or the diagnosis process.
          sed -E \
            -e 's/(authorization:[[:space:]]*bearer[[:space:]]+)[^[:space:]]+/\1[REDACTED]/Ig' \
            -e 's/(authorization:[[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' \
            -e 's/((token|password|secret|api[_-]?key)[=:][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' \
            -e 's/(gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+|AKIA[0-9A-Z]{16})/[REDACTED]/g' \
            "$raw_log" | head -c 262144 > "$RUNNER_TEMP/ceaser-failed.log" || true
          gh run view "$INPUT_RUN_ID" --repo "$INPUT_REPOSITORY" \
            --json jobs \
            --jq '.jobs[] | select(.conclusion == "failure") | "\(.name) (\(.databaseId))"' \
            > "$RUNNER_TEMP/ceaser-failed-jobs.txt" 2>&1 || true
          mkdir -p "$RUNNER_TEMP/ceaser-artifacts"
          gh run download "$INPUT_RUN_ID" --repo "$INPUT_REPOSITORY" \
            --dir "$RUNNER_TEMP/ceaser-artifacts" || true

      - name: Set up Go for Ceaser source install
        if: inputs.ceaser_version == 'main'
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Install ceaser
        env:
          INPUT_VERSION: ${{ inputs.ceaser_version }}
          INPUT_REPOSITORY: ${{ inputs.ceaser_repository }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          repository="$INPUT_REPOSITORY"
          if [[ ! "$version" =~ ^(main|latest|v[0-9A-Za-z._-]+)$ ]]; then
            echo "invalid ceaser_version" >&2
            exit 2
          fi
          if [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "invalid ceaser_repository" >&2
            exit 2
          fi
          if [ "$version" = "main" ]; then
            # Resolve the branch directly because module proxies can cache @main.
            revision="$(git ls-remote --exit-code "https://github.com/$repository.git" refs/heads/main | cut -f1)"
            [[ "$revision" =~ ^[a-f0-9]{40}$ ]] || exit 2
            echo "Installing Ceaser at $revision"
            source="$(mktemp -d "$RUNNER_TEMP/ceaser-source.XXXXXX")"
            git -C "$source" init -q
            git -C "$source" fetch -q --depth=1 "https://github.com/$repository.git" "$revision"
            git -C "$source" checkout -q --detach FETCH_HEAD
            (cd "$source" && go build -mod=readonly -o "$RUNNER_TEMP/ceaser" ./cmd/ceaser)
            echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/ceaser" version
            exit 0
          fi
          if [ "$version" = "latest" ]; then
            base_url="https://github.com/$repository/releases/latest/download"
          else
            base_url="https://github.com/$repository/releases/download/$version"
          fi
          for asset in ceaser_linux_amd64 malenia_linux_amd64 causent_linux_amd64; do
            if curl -fsSL "$base_url/$asset" -o "$RUNNER_TEMP/ceaser"; then break; fi
          done
          curl -fsSL "$base_url/SHA256SUMS" -o "$RUNNER_TEMP/ceaser.SHA256SUMS"
          (cd "$RUNNER_TEMP" && grep "  $asset\$" ceaser.SHA256SUMS | sed "s/$asset/ceaser/" | sha256sum -c -)
          chmod +x "$RUNNER_TEMP/ceaser"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ceaser" version

      - name: Set up Go
        if: inputs.docker_image == '' && hashFiles('go.mod') != ''
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Restore Go's content-addressed module and build caches so repeated
          # investigations compile only packages invalidated by the PR.
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Diagnose
        id: diagnose
        env:
          INPUT_COMMAND: ${{ inputs.command }}
          INPUT_ATTEMPTS: ${{ inputs.attempts }}
          INPUT_DOCKER_IMAGE: ${{ inputs.docker_image }}
          INPUT_GO_COLD_PATH_ATTEMPTS: ${{ inputs.go_cold_path_attempts }}
          CEASER_SANDBOX_MEMORY_MB: ${{ inputs.go_cold_path && '3072' || '512' }}
          INPUT_BASE: ${{ steps.revisions.outputs.base }}
          CEASER_CI_PROVIDER: github-actions
          CEASER_CI_RUN_ID: ${{ inputs.run_id }}
          CEASER_CI_PR_NUMBER: ${{ steps.revisions.outputs.pr }}
          CEASER_CI_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.run_id }}
          INPUT_CI_LOG: ${{ runner.temp }}/ceaser-failed.log
          INPUT_ARTIFACT_DIR: ${{ runner.temp }}/ceaser-artifacts
        run: |
          set -euo pipefail
          args=(diagnose --repo . --json --bundle "$RUNNER_TEMP/ceaser-bundle")

          if [ -n "$INPUT_COMMAND" ]; then
            args+=(--command "$INPUT_COMMAND")
          fi
          if [ -n "$INPUT_BASE" ]; then
            args+=(--base "$INPUT_BASE")
          fi
          if [ -s "$INPUT_CI_LOG" ]; then
            args+=(--ci-log "$INPUT_CI_LOG")
          fi
          if [ -d "$INPUT_ARTIFACT_DIR" ]; then
            args+=(--artifact-dir "$INPUT_ARTIFACT_DIR" --artifact-first)
          fi
          if [ -n "$INPUT_ATTEMPTS" ]; then
            args+=(--attempts "$INPUT_ATTEMPTS")
          fi
          if [ -n "$INPUT_DOCKER_IMAGE" ]; then
            args+=(--executor docker --image "$INPUT_DOCKER_IMAGE")
          fi
          if [ "${{ inputs.go_cold_path }}" = "true" ]; then
            if [ -z "$INPUT_DOCKER_IMAGE" ]; then
              echo 'go_cold_path requires docker_image' >&2
              exit 2
            fi
            if [[ ! "$INPUT_GO_COLD_PATH_ATTEMPTS" =~ ^([1-9]|1[0-9]|20)$ ]]; then
              echo 'go_cold_path_attempts must be between 1 and 20' >&2
              exit 2
            fi
            args+=(--go-cold-path --go-cold-path-attempts "$INPUT_GO_COLD_PATH_ATTEMPTS")
          fi
          status=0
          ceaser "${args[@]}" > "$RUNNER_TEMP/ceaser-report.json" \
            2> "$RUNNER_TEMP/ceaser-stderr.log" || status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

          if ! jq -e . "$RUNNER_TEMP/ceaser-report.json" > /dev/null 2>&1; then
            {
              echo "## Ceaser diagnosis"
              echo
              echo "Ceaser did not produce a report (exit $status)."
              echo
              echo '```'
              tail -50 "$RUNNER_TEMP/ceaser-stderr.log"
              echo '```'
            } > "$RUNNER_TEMP/ceaser-summary.md"
            cat "$RUNNER_TEMP/ceaser-summary.md" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          classification="$(jq -r '.classification // "unknown"' "$RUNNER_TEMP/ceaser-report.json")"
          refused="$(jq -r '.refused // false' "$RUNNER_TEMP/ceaser-report.json")"
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          echo "refused=$refused" >> "$GITHUB_OUTPUT"

          jq -r '
            def plain: .[0:1200] | gsub("@"; "＠") | @html;
            def block: "<pre>" + plain + "</pre>";
            ([ (.candidate_report.entries // [])[]?.file, (.candidates // [])[]?.location.file_path ]
              | map(select(type == "string")) | unique) as $paths |
            "## Ceaser diagnosis",
            "",
            "**What failed**",
            "",
            ([.normalized_evidence.executions[]?.tests[]? |
                select(.state == "failed" and (.name // "") != "" and (.message // "") != "") |
                . as $test |
                [$paths[] | select(. == $test.file or endswith("/" + ($test.file // "")))] as $matches |
                .name + (if (.file // "") != "" and (.line // 0) > 0 then
                  " at " + (if ($matches | length) == 1 then $matches[0] else .file end) + ":" + (.line | tostring)
                else "" end) + " — " + .message] as $tests |
              [(.failure_incidents // [])[] | select(.category == "go_data_race" and (.observed_explanation // "") != "") |
                .observed_explanation] as $races |
              if ($races | length) > 0 then $races[0]
              elif ($tests | length) > 0 then $tests[:3] | join("\n")
              else [(.failure_episodes // [])[] | select((.test_identifier // "") != "") |
                      .test_identifier + " — " + (.failure_message // "Failed")] as $episodes |
                if ($episodes | length) > 0 then $episodes[:3] | join("\n")
                else .failure_incidents[0].observed_explanation // .classification // "No specific failure was extracted."
                end
              end | block),
            "",
            "**Where to look**",
            "",
            ([if ((.candidate_report.entries // []) | length) > 0 then
                .candidate_report.entries[] | select((.file // "") != "" and (.file | endswith("_test.go") | not)) |
                .file + (if (.line // 0) > 0 then ":" + (.line | tostring) else "" end) +
                " — " + (.reason // "ranked candidate")
              else
                .candidates[]? | select((.location.file_path // "") != "" and (.location.file_path | endswith("_test.go") | not)) |
                .location.file_path + (if (.location.start_line // 0) > 0 then ":" + (.location.start_line | tostring) else "" end)
              end] |
              if length == 0 then "No implementation candidate found." else .[:3] | join("\n") end | block),
            "",
            (if .root_cause.status == "established" and (.root_cause.statement // "") != "" then .root_cause.statement | block
              else "Implementation cause unresolved."
              end),
            "",
            (if .reproduction_status == "deferred" or .baseline.source == "ci_artifact" or .baseline.source == "normalized_ci_evidence" then
              "**Reproduction:** Deferred. Analyzed existing CI evidence."
            elif (.baseline.attempts // 0) > 0 then
              "**Reproduction:** \(.baseline.failures // 0)/\(.baseline.attempts) local attempts failed."
            else "**Reproduction:** No local attempts recorded." end),
            (if .comparison then
              "**Base/head:** base \(.comparison.base.failures // 0)/\(.comparison.base.attempts // 0), head \(.comparison.head.failures // 0)/\(.comparison.head.attempts // 0)."
            else empty end),
            (if ((.adapter_capabilities // []) | length) > 0 then
              "**Adapter support:** " + ((.adapter_capabilities // []) | map((.language // .adapter) + "=" + .level) | join(", ") | plain)
            else empty end)
          ' "$RUNNER_TEMP/ceaser-report.json" > "$RUNNER_TEMP/ceaser-summary.md"
          printf '\nDownload the diagnosis artifact for the full report and evidence.\n' >> "$RUNNER_TEMP/ceaser-summary.md"
          cat "$RUNNER_TEMP/ceaser-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Export investigation brief
        run: |
          set -euo pipefail
          if ceaser brief --report "$RUNNER_TEMP/ceaser-report.json" > "$RUNNER_TEMP/ceaser-brief.md.tmp"; then
            mv "$RUNNER_TEMP/ceaser-brief.md.tmp" "$RUNNER_TEMP/ceaser-brief.md"
          else
            echo "::warning::Could not export a Markdown brief. The JSON report is still available."
          fi

      - name: Upload diagnosis bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ceaser-diagnosis-raw-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ceaser-report.json
            ${{ runner.temp }}/ceaser-summary.md
            ${{ runner.temp }}/ceaser-brief.md
            ${{ runner.temp }}/ceaser-stderr.log
            ${{ runner.temp }}/ceaser-failed.log
            ${{ runner.temp }}/ceaser-failed-jobs.txt
            ${{ runner.temp }}/ceaser-artifacts
            ${{ runner.temp }}/ceaser-bundle
          if-no-files-found: ignore

  analyze:
    name: Optional model analysis
    needs: diagnose
    if: needs.diagnose.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download deterministic diagnosis
        uses: actions/download-artifact@v4
        with:
          name: ceaser-diagnosis-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/ceaser-raw

      - name: Set up Go for Ceaser source install
        if: inputs.agent && inputs.ceaser_version == 'main'
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Install ceaser
        if: inputs.agent
        env:
          INPUT_VERSION: ${{ inputs.ceaser_version }}
          INPUT_REPOSITORY: ${{ inputs.ceaser_repository }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          repository="$INPUT_REPOSITORY"
          if [[ ! "$version" =~ ^(main|latest|v[0-9A-Za-z._-]+)$ ]]; then
            echo "invalid ceaser_version" >&2
            exit 2
          fi
          if [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "invalid ceaser_repository" >&2
            exit 2
          fi
          if [ "$version" = "main" ]; then
            # Resolve the branch directly because module proxies can cache @main.
            revision="$(git ls-remote --exit-code "https://github.com/$repository.git" refs/heads/main | cut -f1)"
            [[ "$revision" =~ ^[a-f0-9]{40}$ ]] || exit 2
            echo "Installing Ceaser at $revision"
            source="$(mktemp -d "$RUNNER_TEMP/ceaser-source.XXXXXX")"
            git -C "$source" init -q
            git -C "$source" fetch -q --depth=1 "https://github.com/$repository.git" "$revision"
            git -C "$source" checkout -q --detach FETCH_HEAD
            (cd "$source" && go build -mod=readonly -o "$RUNNER_TEMP/ceaser" ./cmd/ceaser)
            echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/ceaser" version
            exit 0
          fi
          if [ "$version" = "latest" ]; then
            base_url="https://github.com/$repository/releases/latest/download"
          else
            base_url="https://github.com/$repository/releases/download/$version"
          fi
          for asset in ceaser_linux_amd64 malenia_linux_amd64 causent_linux_amd64; do
            if curl -fsSL "$base_url/$asset" -o "$RUNNER_TEMP/ceaser"; then break; fi
          done
          curl -fsSL "$base_url/SHA256SUMS" -o "$RUNNER_TEMP/ceaser.SHA256SUMS"
          (cd "$RUNNER_TEMP" && grep "  $asset\$" ceaser.SHA256SUMS | sed "s/$asset/ceaser/" | sha256sum -c -)
          chmod +x "$RUNNER_TEMP/ceaser"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ceaser" version

      - name: Preserve deterministic report
        if: inputs.agent == false
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ceaser-final"
          cp "$RUNNER_TEMP/ceaser-raw/ceaser-report.json" "$RUNNER_TEMP/ceaser-final/ceaser-report.json"

      - name: Checkout source for read-only model retrieval
        if: inputs.agent && inputs.agent_code_retrieval && needs.diagnose.outputs.head != ''
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: ${{ needs.diagnose.outputs.head }}
          path: ceaser-agent-source
          persist-credentials: false

      - name: Analyze validated diagnosis
        if: inputs.agent == true
        env:
          CEASER_GATEWAY_ENDPOINT: ${{ secrets.CEASER_GATEWAY_ENDPOINT }}
          CEASER_GATEWAY_MODEL: ${{ secrets.CEASER_GATEWAY_MODEL }}
          CODE_REVISION: ${{ needs.diagnose.outputs.head }}
          CODE_RETRIEVAL: ${{ inputs.agent_code_retrieval }}
        run: |
          set -euo pipefail
          code_args=()
          if [ "$CODE_RETRIEVAL" = "true" ] && [ -d "$GITHUB_WORKSPACE/ceaser-agent-source/.git" ]; then
            code_args=(--code-repo "$GITHUB_WORKSPACE/ceaser-agent-source" --code-revision "$CODE_REVISION")
          fi
          mkdir -p "$RUNNER_TEMP/ceaser-final"
          if ! ceaser analyze \
            --report "$RUNNER_TEMP/ceaser-raw/ceaser-report.json" \
            --output "$RUNNER_TEMP/ceaser-final/ceaser-report.json" "${code_args[@]}"; then
            cp "$RUNNER_TEMP/ceaser-raw/ceaser-report.json" "$RUNNER_TEMP/ceaser-final/ceaser-report.json"
          fi

      - name: Copy evidence artifacts
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/ceaser-raw/ceaser-brief.md" "$RUNNER_TEMP/ceaser-final/ceaser-brief.md" || true
          cp "$RUNNER_TEMP/ceaser-raw/ceaser-summary.md" "$RUNNER_TEMP/ceaser-final/ceaser-summary.md" || true
          cp "$RUNNER_TEMP/ceaser-raw/ceaser-stderr.log" "$RUNNER_TEMP/ceaser-final/ceaser-stderr.log" || true
          cp "$RUNNER_TEMP/ceaser-raw/ceaser-failed.log" "$RUNNER_TEMP/ceaser-final/ceaser-failed.log" || true
          cp "$RUNNER_TEMP/ceaser-raw/ceaser-failed-jobs.txt" "$RUNNER_TEMP/ceaser-final/ceaser-failed-jobs.txt" || true
          cp -R "$RUNNER_TEMP/ceaser-raw/ceaser-bundle" "$RUNNER_TEMP/ceaser-final/ceaser-bundle" || true

      - name: Refresh brief with retrieved source
        if: inputs.agent && inputs.agent_code_retrieval
        run: |
          set -euo pipefail
          if ceaser brief --report "$RUNNER_TEMP/ceaser-final/ceaser-report.json" > "$RUNNER_TEMP/ceaser-brief-final.md"; then
            mv "$RUNNER_TEMP/ceaser-brief-final.md" "$RUNNER_TEMP/ceaser-final/ceaser-brief.md"
          fi

      - name: Upload final diagnosis
        uses: actions/upload-artifact@v6
        with:
          name: ceaser-diagnosis-${{ github.run_id }}
          path: ${{ runner.temp }}/ceaser-final
          if-no-files-found: error

  publish:
    name: Publish diagnosis
    needs: [diagnose, analyze]
    if: needs.analyze.result == 'success' && inputs.comment && needs.diagnose.outputs.pr != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Download diagnosis result
        uses: actions/download-artifact@v4
        with:
          name: ceaser-diagnosis-${{ github.run_id }}
          path: ${{ runner.temp }}/ceaser-result

      - name: Prepare bounded diagnosis comment
        env:
          PR_NUMBER: ${{ needs.diagnose.outputs.pr }}
          COMMENT_DETAIL: ${{ inputs.comment_detail }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/ceaser-result/ceaser-report.json"
          test -s "$report"
          issues="$(jq -r '
            def failed_tests: [.normalized_evidence.executions[]?.tests[]? | select(.state == "failed")];
            def known_files: [(.candidate_report.entries // [])[]?.file, (.candidates // [])[]?.location.file_path] | map(select(type == "string")) | unique;
            def test_file($file; $paths):
              if ($file | contains("/")) then $file
              else [$paths[] | select(. == $file or endswith("/" + $file))] |
                if length == 1 then .[0] else $file end
              end;
            known_files as $paths |
            [(failed_tests[] | select((.name // "") != "" and (.message // "") != "") |
              .name + (if (.file // "") != "" and (.line // 0) > 0 then
                " at " + test_file(.file; $paths) + ":" + (.line | tostring)
              else "" end) + " — " + .message)] as $tests |
            [(.failure_incidents // [])[] |
              select(.category == "go_data_race" and (.observed_explanation // "") != "") |
              .observed_explanation] as $races |
            if ($races | length) > 0 then "The Go race detector reported conflicting concurrent accesses."
            elif ($tests | length) > 0 then $tests[:3] | join("\n")
            else [(.failure_episodes // [])[] |
              select((.test_identifier // "") != "") |
              .test_identifier + " — " + (.failure_message // "Failed")] as $episodes |
              if ($episodes | length) > 0 then $episodes[:3] | join("\n")
              else .failure_incidents[0].observed_explanation //
                .findings[0].statement // .classification // "No specific failure was extracted."
              end
            end
          ' "$report")"
          shortlist="$(jq -r '
            def implementation: type == "string" and length > 0 and (endswith("_test.go") | not);
            if ((.candidate_report.entries // []) | length) > 0 then
              [.candidate_report.entries[] | select(.file | implementation) |
                "[" + (.kind // "candidate") + "] " + .file +
                (if ((.line // 0) > 0) then ":" + (.line|tostring) else "" end) +
                (if ((.function // "") == "") then "" else " " + .function end) +
                " — " + (.reason // "ranked candidate") +
                (if ((.evidence_ids // []) | length) > 0 then " [Evidence: " + ((.evidence_ids[0:3]) | join(", ")) + "]" else "" end)
              ] | .[:3] | join("\n")
            else
              [(.candidates // [])[] | select(.location.file_path | implementation) |
                .location.file_path + ":" + ((.location.start_line // 0)|tostring) +
                " (" + (.location.provenance // "unattributed") + ")"] | .[:3] | join("\n")
            end
          ' "$report")"
          brief_leads="$(jq -r '
            def impl: type == "string" and length > 0 and (endswith("_test.go") | not);
            def location: .file + (if (.line // 0) > 0 then ":" + (.line | tostring) else "" end);
            [if ((.candidate_report.entries // []) | length) > 0 then
              .candidate_report.entries[] | select(.file | impl) | location
            else
              .candidates[]?.location | select(.file_path | impl) |
              {file: .file_path, line: .start_line} | location
            end] | .[:2] | join("\n")
          ' "$report")"
          reproduction="$(jq -r '
            if .reproduction_status == "deferred" then "Deferred. Analyzed existing CI evidence."
            else "\(.baseline.failures // 0)/\(.baseline.attempts // 0) head attempts failed; \(.comparison.base.passes // 0)/\(.comparison.base.attempts // 0) base attempts passed."
            end
          ' "$report")"
          cause="$(jq -r '
            .root_cause as $root |
            if (($root.evidence_ids // []) | length) > 0 and ($root.statement // "") != "" then
              if $root.status == "established" then $root.statement
              elif $root.status == "partially_established" and $root.causality_status == "mechanism_established_source_unmapped" then
                "Supported explanation: " + $root.statement
              else "" end
            else "" end
          ' "$report")"
          details="$(jq -r '
            def bullet($values): if ($values | length) > 0 then $values | join("\n") else empty end;
            ["Classification: " + (.classification // "unknown"),
              (if (.command | type) == "array" and (.command | length) > 0 then "Command: " + (.command | join(" ")) else empty end),
              ((.failure_incidents // [])[:2][] | .observed_explanation // empty),
              (if ((.root_cause.evidence_ids // []) | length) > 0 then
                "Evidence: " + ((.root_cause.evidence_ids[:5]) | join(", "))
                else empty end),
              ((.root_cause.missing_evidence // [])[:3][] | "Still needed: " + .),
              ((.root_cause.next_actions // [])[:3][] | "Next check: " + .)
            ] | bullet(.)
          ' "$report")"
          plain() {
            printf '%s' "$1" | jq -Rrs '.[0:1200] | gsub("@"; "＠") | @html'
          }
          artifact_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            printf '## Ceaser diagnosis\n\n**What failed**\n\n<pre>%s</pre>\n' "$(plain "$issues")"
            if [ -n "$cause" ]; then
              printf '\n<pre>%s</pre>\n' "$(plain "$cause")"
            fi
            if [ -n "$brief_leads" ]; then
              printf '\n**Where to look**\n\n<pre>%s</pre>\n' "$(plain "$brief_leads")"
            elif [ -z "$cause" ]; then
              printf '\nImplementation cause unresolved.\n'
            fi
            printf '\n%s\n' "$(plain "$reproduction")"
            if [ "${COMMENT_DETAIL:-short}" = "detailed" ]; then
              printf '\n**Diagnosis details**\n\n<pre>%s</pre>\n' "$(plain "$details")"
            else
              printf '\n<details>\n<summary>Diagnosis details</summary>\n\n<pre>%s</pre>\n' "$(plain "$details")"
            fi
            if [ -n "$shortlist" ]; then
              printf '\n<pre>%s</pre>\n' "$(plain "$shortlist")"
            fi
            if [ "${COMMENT_DETAIL:-short}" != "detailed" ]; then
              printf '\n</details>\n'
            fi
            printf '\n[View the workflow run and download the investigation brief](%s)\n' "$artifact_url"
          } > "$RUNNER_TEMP/ceaser-comment.md"
          jq -r '
            if .agent_status == "completed" then
              [.agent.hypotheses[0:2][]? |
                ((.statement // "")[0:600] + " [Evidence: " +
                 ((.supporting_evidence_ids // []) | join(", ") | .[0:240]) + "]") |
                gsub("@"; "＠") | @html]
              | if length > 0 then "\n<details>\n<summary>Optional model interpretation</summary>\n\n<pre>" + join("\n\n") + "</pre>\n\n</details>" else empty end
            else empty end
          ' "$report" >> "$RUNNER_TEMP/ceaser-comment.md"

      - name: Publish bounded diagnosis comment
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.diagnose.outputs.pr }}
          COMMENT_PATH: ${{ runner.temp }}/ceaser-comment.md
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8');
            const issueNumber = Number(process.env.PR_NUMBER);
            const marker = '<!-- ceaser-diagnosis -->';
            const previousMarker = '<!-- malenia-diagnosis -->';
            const markedBody = `${marker}\n${body}`;
            if (!Number.isInteger(issueNumber) || issueNumber < 1) {
              throw new Error(`Invalid pull request number: ${process.env.PR_NUMBER}`);
            }

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              const existing = comments.find(comment =>
                comment.user?.login === 'github-actions[bot]' &&
                (comment.body?.includes(marker) || comment.body?.includes(previousMarker))
              );
              const payload = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: markedBody,
              };
              if (existing) {
                await github.rest.issues.updateComment({ ...payload, comment_id: existing.id });
              } else {
                await github.rest.issues.createComment(payload);
              }
            } catch (error) {
              core.setFailed(`Unable to publish diagnosis comment: ${error.status ?? 'unknown'} ${error.message}`);
            }
