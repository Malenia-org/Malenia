name: Try Ceaser on a public PR

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Public GitHub repository, owner/name
        required: true
        type: string
      pull_request:
        description: Pull request number
        required: true
        type: string
      target_revision:
        description: Exact target commit for a historical fixture; allows merged PRs when set
        required: false
        default: ''
        type: string
      test_command:
        description: Test command to run at the PR head (for example, go test ./...)
        required: true
        type: string
      ceaser_version:
        description: Prebuilt Ceaser release to use; use source_build for unreleased code
        required: false
        default: v8
        type: string
      source_build:
        description: Build Ceaser from the checked-out source instead of using a release binary
        required: false
        default: false
        type: boolean
      docker_image:
        description: Optional Docker image with the project's runtime and test tools
        required: false
        type: string
      attempts:
        description: Reproduction attempts
        required: true
        default: '1'
        type: string
      max_probes:
        description: Maximum historical test runs for adaptive localization
        required: true
        default: '3'
        type: string
      skip_adaptive:
        description: Publish the preliminary diagnosis without optional deep experiments
        required: false
        default: false
        type: boolean
      fast_path:
        description: Publish after inconclusive reproduction without expensive comparison/localization
        required: false
        default: true
        type: boolean
      timeout_seconds:
        description: Maximum seconds for each test command
        required: false
        default: '120'
        type: string
      investigation_timeout_seconds:
        description: Maximum seconds for the complete diagnosis
        required: false
        default: '600'
        type: string
      source_run_id:
        description: Existing failed CI workflow run to analyze; when omitted, the latest failed run for the PR head is selected
        required: false
        default: ''
        type: string
      source_ci_url:
        description: Original failed CI URL; accepts a Prow GS URL and derives its build identifier
        required: false
        default: ''
        type: string
      allow_reproduction_fallback:
        description: Run the configured command when no original CI evidence can be collected
        required: false
        default: false
        type: boolean
      allow_closed_pr:
        description: Allow closed or merged PRs (for retrospective corpus testing); live PR diagnosis should leave this false
        required: false
        default: false
        type: boolean
      go_cold_path:
        description: Explicitly build and run a focused retained Go test binary on head and base
        required: false
        default: false
        type: boolean
      go_cold_path_attempts:
        description: Focused Go verification attempts per revision
        required: false
        default: '3'
        type: string
      repair:
        description: Explicitly run bounded isolated repair verification and include its result
        required: false
        default: false
        type: boolean
      agent:
        description: Ask the configured model gateway to investigate collected evidence
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out Ceaser
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate inputs and resolve PR revisions
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          PULL_NUMBER: ${{ inputs.pull_request }}
          TARGET_REVISION: ${{ inputs.target_revision }}
          ALLOW_CLOSED_PR: ${{ inputs.allow_closed_pr }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo 'target_repository must be owner/name' >&2
            exit 2
          fi
          if [[ ! "$PULL_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo 'pull_request must be a positive integer' >&2
            exit 2
          fi
          metadata="$RUNNER_TEMP/target-pr.json"
          http_status="$(curl --silent --show-error --location --retry 2 --retry-all-errors \
            "https://api.github.com/repos/$TARGET_REPOSITORY/pulls/$PULL_NUMBER" \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'User-Agent: Ceaser-GitHub-Actions' \
            -o "$metadata" -w '%{http_code}')"
          if [[ "$http_status" != 200 ]]; then
            api_message="$(jq -r '.message // "no error message returned"' "$metadata" 2>/dev/null || true)"
            echo "GitHub could not resolve PR $TARGET_REPOSITORY#$PULL_NUMBER (HTTP $http_status): $api_message" >&2
            if [[ "$http_status" == 404 ]]; then
              echo 'Check that target_repository is the public owner/name repository and pull_request is an existing PR number.' >&2
            fi
            exit 2
          fi
          if [ -n "$TARGET_REVISION" ]; then
            if [[ ! "$TARGET_REVISION" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo 'target_revision must be a full 40-character commit SHA' >&2
              exit 2
            fi
          elif [ "$ALLOW_CLOSED_PR" = "true" ]; then
            # Retrospective corpus testing: closed/merged revisions are intentional.
            jq -e '.base.sha and .head.sha' "$metadata" >/dev/null || {
              echo "PR $TARGET_REPOSITORY#$PULL_NUMBER has no resolvable base/head revisions" >&2
              exit 2
            }
          elif ! jq -e '.state == "open" and .base.sha and .head.sha' "$metadata" >/dev/null; then
            state="$(jq -r '.state // "unknown"' "$metadata")"
            echo "PR $TARGET_REPOSITORY#$PULL_NUMBER must be open and have resolvable base/head revisions (state: $state)" >&2
            echo "For retrospective testing of a closed PR, set allow_closed_pr=true." >&2
            exit 2
          fi
          if [ -n "$TARGET_REVISION" ]; then
            echo 'base_sha=' >> "$GITHUB_OUTPUT"
            echo "head_sha=$TARGET_REVISION" >> "$GITHUB_OUTPUT"
            echo 'historical_fixture=true' >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=$(jq -r '.base.sha' "$metadata")" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(jq -r '.head.sha' "$metadata")" >> "$GITHUB_OUTPUT"
            echo 'historical_fixture=false' >> "$GITHUB_OUTPUT"
          fi
          echo "pr_url=$(jq -r '.html_url' "$metadata")" >> "$GITHUB_OUTPUT"
          echo "clone_url=$(jq -r '.base.repo.clone_url' "$metadata")" >> "$GITHUB_OUTPUT"
          echo "artifact_slug=${TARGET_REPOSITORY//\//-}" >> "$GITHUB_OUTPUT"

      - name: Collect original CI evidence
        id: evidence
        if: inputs.source_run_id != '' || steps.pr.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_CI_URL: ${{ inputs.source_ci_url }}
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/resolve-source-evidence.sh"

      - name: Check out target PR
        env:
          CLONE_URL: ${{ steps.pr.outputs.clone_url }}
          PULL_NUMBER: ${{ inputs.pull_request }}
          TARGET_REVISION: ${{ inputs.target_revision }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          FAST_PATH: ${{ inputs.fast_path }}
          EVIDENCE_AVAILABLE: ${{ steps.evidence.outputs.available }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/target"
          git -C "$RUNNER_TEMP/target" init
          git -C "$RUNNER_TEMP/target" remote add origin "$CLONE_URL"
          if [ -n "$TARGET_REVISION" ]; then
            git -C "$RUNNER_TEMP/target" fetch --no-tags --depth=1 origin "$HEAD_SHA"
            actual_head="$(git -C "$RUNNER_TEMP/target" rev-parse FETCH_HEAD)"
          else
            git -C "$RUNNER_TEMP/target" fetch --no-tags --depth=1 origin \
              "refs/pull/$PULL_NUMBER/head:refs/remotes/origin/ceaser-pr"
            if [[ "$FAST_PATH" != "true" || "$EVIDENCE_AVAILABLE" == "true" ]]; then
              git -C "$RUNNER_TEMP/target" fetch --no-tags --deepen=64 origin \
                "refs/pull/$PULL_NUMBER/head"
              git -C "$RUNNER_TEMP/target" fetch --no-tags --depth=1 origin "$BASE_SHA"
            fi
            actual_head="$(git -C "$RUNNER_TEMP/target" rev-parse refs/remotes/origin/ceaser-pr)"
          fi
          if [ "$actual_head" != "$HEAD_SHA" ]; then
            echo 'PR head changed while preparing the run; restart with the updated PR revision' >&2
            exit 1
          fi
          git -C "$RUNNER_TEMP/target" checkout --detach "$HEAD_SHA"

      - name: Set up Go for Ceaser source build
        if: inputs.source_build
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Ceaser binary
        id: ceaser-cache
        if: inputs.source_build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ceaser
          key: ceaser-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

      - name: Build Ceaser binary from source
        if: inputs.source_build
        env:
          # Keep Ceaser's own dependencies out of the target repository cache;
          # actions/cache restores fail when immutable module files already exist.
          GOMODCACHE: ${{ runner.temp }}/ceaser-gomodcache
          GOCACHE: ${{ runner.temp }}/ceaser-gocache
        run: |
          set -euo pipefail
          if [ "${{ steps.ceaser-cache.outputs.cache-hit }}" = "true" ] && [ -x "$RUNNER_TEMP/ceaser" ]; then
            echo "Using cached Ceaser binary for source commit ${{ github.sha }}"
          else
            go build -o "$RUNNER_TEMP/ceaser" ./cmd/ceaser
          fi
          "$RUNNER_TEMP/ceaser" version

      - name: Install prebuilt Ceaser release
        if: ${{ !inputs.source_build }}
        env:
          CEASER_VERSION: ${{ inputs.ceaser_version }}
        run: |
          set -euo pipefail
          if [[ "$CEASER_VERSION" == "latest" ]]; then
            base_url="https://github.com/ceaser-org/ceaser/releases/latest/download"
          elif [[ "$CEASER_VERSION" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            base_url="https://github.com/ceaser-org/ceaser/releases/download/$CEASER_VERSION"
          else
            echo 'ceaser_version must be latest or a release tag beginning with v' >&2
            exit 2
          fi
          for asset in ceaser_linux_amd64 malenia_linux_amd64 causent_linux_amd64; do
            if curl -fsSL "$base_url/$asset" -o "$RUNNER_TEMP/ceaser"; then break; fi
          done
          curl -fsSL "$base_url/SHA256SUMS" -o "$RUNNER_TEMP/ceaser.SHA256SUMS"
          (cd "$RUNNER_TEMP" && grep "  $asset\$" ceaser.SHA256SUMS | sed "s/$asset/ceaser/" | sha256sum -c -)
          chmod +x "$RUNNER_TEMP/ceaser"
          "$RUNNER_TEMP/ceaser" version

      - name: Resolve target Go version
        id: target-go
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/target/go.mod" ]]; then
            version="$(sed -nE 's/^go[[:space:]]+([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/p' \
              "$RUNNER_TEMP/target/go.mod" | head -n 1)"
            if [[ -n "$version" ]]; then
              echo "version=$version" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Go for target repository
        if: steps.target-go.outputs.version != ''
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.target-go.outputs.version }}
          cache: false

      - name: Resolve target Go cache key
        if: steps.target-go.outputs.version != ''
        id: target-go-cache
        env:
          TARGET_ROOT: ${{ runner.temp }}/target
        run: |
          set -euo pipefail
          mapfile -d '' sums < <(find "$TARGET_ROOT" -type f -name go.sum -print0 | sort -z)
          if [ "${#sums[@]}" -eq 0 ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          digest="$(printf '%s\0' "${sums[@]}" | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore target Go caches
        if: steps.target-go-cache.outputs.enabled == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.target-go-cache.outputs.gomodcache }}
            ${{ steps.target-go-cache.outputs.gocache }}
          key: ${{ runner.os }}-go-${{ steps.target-go.outputs.version }}-${{ steps.target-go-cache.outputs.digest }}
          restore-keys: |
            ${{ runner.os }}-go-${{ steps.target-go.outputs.version }}-

      - name: Diagnose PR
        id: diagnose
        env:
          CEASER_COMMAND: ${{ inputs.test_command }}
          CEASER_BASE: ${{ steps.pr.outputs.base_sha }}
          CEASER_ATTEMPTS: ${{ inputs.attempts }}
          CEASER_MAX_PROBES: ${{ inputs.max_probes }}
          CEASER_DOCKER_IMAGE: ${{ inputs.docker_image }}
          CEASER_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          CEASER_INVESTIGATION_TIMEOUT_SECONDS: ${{ inputs.investigation_timeout_seconds }}
          CEASER_GO_COLD_PATH_ATTEMPTS: ${{ inputs.go_cold_path_attempts }}
          CEASER_SANDBOX_MEMORY_MB: ${{ inputs.go_cold_path && '3072' || '512' }}
          CEASER_CI_PROVIDER: ${{ steps.evidence.outputs.provider }}
          CEASER_CI_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          CEASER_CI_BUILD_ID: ${{ steps.evidence.outputs.build_id }}
          CEASER_CI_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          CEASER_CI_PR_NUMBER: ${{ inputs.pull_request }}
          CEASER_CI_SOURCE_URL: ${{ steps.evidence.outputs.source_url }}
          EVIDENCE_BOUNDED_LOG_PATH: ${{ steps.evidence.outputs.bounded_log_path }}
          EVIDENCE_ARTIFACT_DIR: ${{ steps.evidence.outputs.artifact_dir }}
          CEASER_GATEWAY_ENDPOINT: ${{ secrets.CEASER_GATEWAY_ENDPOINT }}
          CEASER_GATEWAY_MODEL: ${{ secrets.CEASER_GATEWAY_MODEL }}
        run: |
          set -euo pipefail
          if [[ ! "$CEASER_ATTEMPTS" =~ ^[1-5]$ ]]; then
            echo 'attempts must be between 1 and 5' >&2
            exit 2
          fi
          if [[ ! "$CEASER_MAX_PROBES" =~ ^[1-6]$ ]]; then
            echo 'max_probes must be between 1 and 6' >&2
            exit 2
          fi
          if [[ ! "$CEASER_TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]]; then
            echo 'timeout_seconds must be a positive integer' >&2
            exit 2
          fi
          if [[ ! "$CEASER_INVESTIGATION_TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]]; then
            echo 'investigation_timeout_seconds must be a positive integer' >&2
            exit 2
          fi
          if [[ ! "$CEASER_GO_COLD_PATH_ATTEMPTS" =~ ^([1-9]|1[0-9]|20)$ ]]; then
            echo 'go_cold_path_attempts must be between 1 and 20' >&2
            exit 2
          fi
          args=(diagnose --repo "$RUNNER_TEMP/target" --command "$CEASER_COMMAND"
            --base "$CEASER_BASE" --attempts "$CEASER_ATTEMPTS"
            --max-probes "$CEASER_MAX_PROBES"
            --timeout "${CEASER_TIMEOUT_SECONDS}s"
            --investigation-timeout "${CEASER_INVESTIGATION_TIMEOUT_SECONDS}s"
            --json
            --bundle "$RUNNER_TEMP/ceaser-bundle")
          evidence_mode=false
          if [ "${{ steps.evidence.outputs.available }}" = "true" ]; then
            evidence_mode=true
            args+=(--ci-log "$EVIDENCE_BOUNDED_LOG_PATH" \
              --artifact-dir "$EVIDENCE_ARTIFACT_DIR" --artifact-first)
            junit="$(find "$EVIDENCE_ARTIFACT_DIR" -type f \( -iname '*.xml' -o -iname '*.junit' \) -print -quit)"
            if [ -n "$junit" ]; then
              args+=(--junit "$junit")
            fi
          elif [ "${{ inputs.allow_reproduction_fallback }}" != "true" ]; then
            echo "Original CI evidence was not found; refusing to run a fresh reproduction." >&2
            exit 2
          fi
          if { [ "$evidence_mode" != "true" ] || [ "${{ inputs.repair }}" = "true" ] || [ "${{ inputs.go_cold_path }}" = "true" ]; } && [ -z "$CEASER_DOCKER_IMAGE" ]; then
            echo 'Public PR reproduction, cold verification, and repair require an explicit docker_image sandbox.' >&2
            exit 2
          fi
          if [ "$evidence_mode" = "true" ] && [ "${{ inputs.go_cold_path }}" = "true" ]; then
            args+=(--go-cold-path --go-cold-path-attempts "$CEASER_GO_COLD_PATH_ATTEMPTS")
          elif [ "$evidence_mode" = "true" ] && [ -n "$CEASER_DOCKER_IMAGE" ]; then
            args+=(--artifact-base-execution)
          fi
          if [ "${{ inputs.skip_adaptive }}" = "true" ]; then
            args+=(--skip-adaptive)
          fi
          if [ "$evidence_mode" != "true" ] && [ "${{ inputs.fast_path }}" = "true" ]; then
            args+=(--fast-path)
          fi
          if [ "${{ inputs.repair }}" = "true" ]; then
            args+=(--repair)
          fi
          if [ "${{ inputs.agent }}" = "true" ]; then
            if [ -z "${CEASER_GATEWAY_ENDPOINT:-}" ] || [ -z "${CEASER_GATEWAY_MODEL:-}" ]; then
              echo 'agent=true requires CEASER_GATEWAY_ENDPOINT and CEASER_GATEWAY_MODEL secrets' >&2
              exit 2
            fi
            args+=(--agent)
          fi
          if [ -n "$CEASER_DOCKER_IMAGE" ]; then
            args+=(--executor docker --image "$CEASER_DOCKER_IMAGE")
          fi
          outer_timeout=$((CEASER_INVESTIGATION_TIMEOUT_SECONDS + 30))
          timeout --signal=TERM --kill-after=15s "${outer_timeout}s" \
            "$RUNNER_TEMP/ceaser" "${args[@]}" > "$RUNNER_TEMP/ceaser-report.json"

      - name: Write run summary
        env:
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          SOURCE_URL: ${{ steps.evidence.outputs.source_url }}
          RACE_BINARY_STATUS: ${{ steps.evidence.outputs.race_binary_status }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          PULL_NUMBER: ${{ inputs.pull_request }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/ceaser-report.json"
          {
            echo "## Ceaser test: [$TARGET_REPOSITORY#$PULL_NUMBER]($PR_URL)"
            echo
            echo "**Classification:** $(jq -r '.classification // "unknown"' "$report")"
            support="$(jq -r '(.adapter_capabilities // []) | map((.language // .adapter) + "=" + .level) | join(", ")' "$report")"
            if [ -n "$support" ]; then
              echo "**Adapter support:** $support"
            fi
            echo
            if [ "${{ steps.evidence.outputs.available }}" = "true" ]; then
              echo "**Evidence-first:** analyzed original ${{ steps.evidence.outputs.provider }} CI evidence without local reproduction"
              echo "**Original race binary:** ${RACE_BINARY_STATUS:-unavailable}"
              if [ -n "${{ steps.evidence.outputs.source_url }}" ]; then
                echo
                echo "Source check: ${{ steps.evidence.outputs.source_url }}"
              fi
            else
              echo "**Reproduced:** $(jq -r '(.baseline.failures // 0|tostring) + "/" + (.baseline.attempts // 0|tostring)' "$report") attempts failed"
            fi
            if jq -e '.go_cold_path != null' "$report" >/dev/null; then
              echo "**Focused Go verification:** $(jq -r '(.go_cold_path.status // "unknown") + "; verdict=" + (.go_cold_path.verdict // "inconclusive") + "; head matches=" + ((.go_cold_path.head.matched // 0)|tostring) + (if .go_cold_path.base then "; base matches=" + ((.go_cold_path.base.matched // 0)|tostring) else "" end)' "$report")"
            fi
            echo
            primary="$(jq -r '
              . as $report
              | $report.findings[]?
              | select(.kind == "incident_diagnosis") as $finding
              | ($report.failure_incidents[]? | select(("finding:" + .id) == $finding.id)) as $incident
              | ($incident.affected_tests // []) as $tests
              | "### " + ($incident.category // "Observed incident")
                + "\n\n**Affected tests:** " + (if ($tests|length) > 3 then (($tests[0:3]|join(", ")) + " and " + ((($tests|length)-3)|tostring) + " more") else ($tests|join(", ")) end)
                + "\n\n**Observed locations:** "
                + (($incident.observed_locations // []) | map((.access // "access") + ": `" + (.file // "unknown") + ":" + ((.line // 0)|tostring) + "`" + (if .function then " (" + .function + ")" else "" end)) | join("; "))
                + "\n\n" + ($finding.statement // $incident.observed_explanation // "Observed incident evidence preserved.")
                + "\n\n**Relevant code:** " + ($incident.proposed_explanation // "No mechanism established.")
                + "\n\n**PR relationship:** " + ($incident.pr_relationship // "Not established.")
                + "\n\n**Evidence IDs:** " + (($finding.evidence_ids // $incident.evidence_ids // []) | join(", "))
                + "\n\n**Root cause assessment:** " + (($report.root_cause.status // "unknown") + ": " + ($report.root_cause.statement // "not established") + "; causality=" + ($report.root_cause.causality_status // "unverified") + "; verification=" + ($report.root_cause.verification_status // "not_attempted"))
                + (if (($report.root_cause.next_actions // [])|length) > 0 then "\n\n**Next verification:** " + (($report.root_cause.next_actions // [])|join("; ")) else "" end)
                + "\n\n**Confidence:** observed=" + (($incident.observed_confidence // 0)|tostring) + ", explanation=" + (($incident.explanation_confidence // 0)|tostring) + ", causality=" + (($incident.causality_confidence // 0)|tostring)' "$report" 2>/dev/null || true)"
            if [ -n "$primary" ]; then
              echo '**Primary diagnosis:**'
              echo "$primary"
              if [ -n "$SOURCE_URL" ]; then
                echo
                echo "**Original CI evidence:** $SOURCE_URL"
              fi
              echo
            fi
            files="$(jq -r '[(.localization.likely_file_reasons // {}) | to_entries[]? | select(any(.value[]?; . == "direct race read location" or . == "direct race write location" or . == "enclosing_symbol" or . == "changed_file" or . == "race goroutine creation stack"))][0:6][] | "- `" + .key + "` — " + ((.value // []) | join(", "))' "$report")"
            if [ -n "$files" ]; then
              echo '**Likely files:**'
              echo "$files"
              echo
            fi
            hypotheses="$(jq -r '
              .hypotheses[]?
              | select((.statement // "") != "")
              | select((.supporting_evidence_ids // []) | length > 0)
              | select((.contradicting_evidence_ids // []) | length > 0)
              | select((.predicted_observations // []) | length > 0)
              | select(((.statement // "") | startswith("Candidate location ")) | not)
              | "- " + .statement
                + " (supporting: " + ((.supporting_evidence_ids // []) | join(", "))
                + "; contradicting: " + ((.contradicting_evidence_ids // []) | join(", "))
                + "; distinguishes: " + ((.predicted_observations // []) | join("; ")) + ")"
            ' "$report" 2>/dev/null || true)"
            if [ -n "$hypotheses" ]; then
              echo '**Causal hypotheses:**'
              echo "$hypotheses"
              echo
            fi
            repair_summary="$(jq -r '
              if .repair then
                "**Status:** " + (.repair.status // "unknown")
                + (if .repair.patch_id then "\n\n**Patch:** `" + .repair.patch_id + "`\n\n**Verification:** " + (.repair.verification_status // "not attempted") else "" end)
                + (if ((.repair.changed_files // []) | length) > 0 then "\n\n**Changed files:** " + ((.repair.changed_files // []) | join(", ")) else "" end)
                + (if ((.repair.limitations // []) | length) > 0 then "\n\n**Limitations:** " + ((.repair.limitations // []) | join("; ")) else "" end)
              else empty end
            ' "$report" 2>/dev/null || true)"
            if [ -n "$repair_summary" ]; then
              echo '**Repair and verification:**'
              echo "$repair_summary"
              echo
            fi
            episodes="$(jq -r 'if ((.race_reports // [])|length) > 0 then empty else [(.failure_episodes // [])[] | select((.test_identifier // "") != "") | select(((.failure_message // "")|contains("[truncated]"))|not)][0:8][] | "- **" + .test_identifier + "** — " + (.failure_message // "observed CI failure") end' "$report" 2>/dev/null || true)"
            if [ -n "$episodes" ]; then
              echo '**Failure episodes:**'
              echo "$episodes"
              echo
            fi
            candidates="$(jq -r '[(.candidates // [])[] | select((.score.execution_relevance // 0) > 0 or (.score.runtime_relevance // 0) > 0 or (.score.change_relevance // 0) > 0)][0:8][] | "- **" + (.location.symbol_identity // "unresolved location") + "** (`" + (.location.file_path // "unknown") + ":" + ((.location.start_line // 0)|tostring) + "`, " + (if .location.provenance == "enclosing_symbol" then "enclosing symbol" elif .location.provenance == "inferred_caller" then "inferred structural candidate" elif .location.provenance == "dependency" then "dependency candidate" elif .location.provenance == "direct_stack_frame" then "directly observed location" else (.location.provenance // .location.location_type // "unattributed") end) + "; execution=" + ((.score.execution_relevance // 0)|tostring) + ")"' "$report" 2>/dev/null || true)"
            if [ -n "$candidates" ]; then
              echo '**Supporting candidate locations:**'
              echo "$candidates"
              echo
            fi
            races="$(jq -r '.race_reports[]? | "- race read: " + ((.read_stack[0].file // "unknown") + ":" + ((.read_stack[0].line // 0)|tostring)) + "; write: " + ((.write_stack[0].file // "unknown") + ":" + ((.write_stack[0].line // 0)|tostring))' "$report" 2>/dev/null || true)"
            if [ -n "$races" ]; then
              echo '**Race evidence:**'
              echo "$races"
              echo
            fi
            if [ "${{ steps.evidence.outputs.available }}" = "true" ]; then
              echo 'The source CI log, downloaded artifacts, and JSON report are attached as the workflow artifact.'
            else
              echo 'The JSON report and reproduction bundle are attached as the workflow artifact.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export investigation brief
        run: |
          set -euo pipefail
          if "$RUNNER_TEMP/ceaser" brief --report "$RUNNER_TEMP/ceaser-report.json" > "$RUNNER_TEMP/ceaser-brief.md.tmp"; then
            mv "$RUNNER_TEMP/ceaser-brief.md.tmp" "$RUNNER_TEMP/ceaser-brief.md"
          else
            echo "::warning::Could not export a Markdown brief. The JSON report is still available."
          fi

      - name: Upload diagnosis report and evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ceaser-pr-diagnosis-${{ steps.pr.outputs.artifact_slug }}-${{ inputs.pull_request }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ceaser-report.json
            ${{ runner.temp }}/ceaser-brief.md
            ${{ runner.temp }}/ceaser-bundle
            ${{ runner.temp }}/source-ci-bounded.log
            ${{ runner.temp }}/source-evidence-status.txt
            ${{ runner.temp }}/source-artifacts
          if-no-files-found: warn
          retention-days: 14
