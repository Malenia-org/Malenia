name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish caeser binary
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'

      - name: Verify release source
        run: |
          go test ./...
          go vet ./...

      - name: Build linux/amd64 binary
        run: |
          set -euo pipefail
          mkdir -p dist
          # The sqlite-backed event store needs cgo, so the binary is built on
          # the same linux/amd64 platform that GitHub runners use.
          CGO_ENABLED=1 go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/caeser_linux_amd64 ./cmd/caeser
          (cd dist && sha256sum caeser_linux_amd64 > SHA256SUMS)

      - name: Smoke-test release binary
        run: |
          set -euo pipefail
          test "$(dist/caeser_linux_amd64 version)" = "caeser ${GITHUB_REF_NAME}"
          printf '%s\n' '--- FAIL: TestRelease (0.00s)' \
            '    release_test.go:5: status mismatch: got "pending", want "ready"' \
            'FAIL' > "$RUNNER_TEMP/failure.log"
          dist/caeser_linux_amd64 evidence --ci-log "$RUNNER_TEMP/failure.log" \
            > "$RUNNER_TEMP/report.json"
          jq -e '.classification == "test_failure_observed"' "$RUNNER_TEMP/report.json"
          dist/caeser_linux_amd64 brief --report "$RUNNER_TEMP/report.json" \
            > "$RUNNER_TEMP/brief.md"
          test -s "$RUNNER_TEMP/brief.md"
          {
            echo "revision=$GITHUB_SHA"
            echo "version=$GITHUB_REF_NAME"
            go version
            ldd dist/caeser_linux_amd64
          } > dist/BUILD_INFO.txt

      - name: Resolve release notes
        id: notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: ${{ steps.notes.outputs.path }}

      - name: Verify published setup action
        uses: ./
        with:
          version: ${{ github.ref_name }}

      - name: Check installed version
        run: test "$(caeser version)" = "caeser ${GITHUB_REF_NAME}"
