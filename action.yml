name: Setup Caeser
description: Install a checksum-verified Caeser binary for CI failure investigation.
author: caeser-org
branding:
  icon: search
  color: blue
inputs:
  version:
    description: Release tag to install, or latest. Source builds are not performed.
    required: false
    default: v9.1
outputs:
  binary-path:
    description: Absolute path to the installed Caeser executable.
    value: ${{ steps.install.outputs.binary-path }}
runs:
  using: composite
  steps:
    - name: Install Caeser release
      id: install
      shell: bash
      env:
        CAESER_VERSION: ${{ inputs.version }}
      run: bash "$GITHUB_ACTION_PATH/.github/scripts/install-caeser.sh"
