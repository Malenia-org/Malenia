version: "0.1.0"
# Go cases live under evaluation/corpus/cases/go/ and are added here as
# real PR data is collected (see GO_COLLECTION.md for the collection process).
# Entries must have a matching cases/<id>/ directory with metadata.yaml,
# expected.yaml, and failure.log — the loader verifies log_sha256.
cases:
  - id: case-000-example
    tier: log_only
    category: regression
  - id: case-001-rinkle-preexisting
    tier: full
    category: pre_existing
  - id: case-002-kwaque-timeout-regression
    tier: full
    category: regression
  - id: case-003-ruflo-lockfile-break
    tier: full
    category: dependency
